<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f2f2f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Reminders">
<link rel="manifest" href="manifest.json">
<title>Reminders</title>
<style>
:root{--bg:#f2f2f7;--card:#fff;--text:#111;--muted:#8e8e93;--blue:#007aff;--red:#ff3b30;--line:#e5e5ea;--shadow:0 1px 2px #0000000d,0 8px 24px #00000008}
@media(prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--text:#fff;--muted:#98989f;--line:#38383a;--shadow:none}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",sans-serif;-webkit-font-smoothing:antialiased}
.app{max-width:700px;margin:auto;min-height:100vh;padding:env(safe-area-inset-top) 16px calc(96px + env(safe-area-inset-bottom))}
header{padding:18px 4px 8px;display:flex;align-items:end;justify-content:space-between}h1{font-size:34px;letter-spacing:-1.3px;margin:0;font-weight:750}.count{font-size:13px;color:var(--muted);margin-bottom:5px}
.search{margin:8px 0 14px;background:var(--card);border-radius:13px;display:flex;gap:8px;align-items:center;padding:10px 12px;box-shadow:var(--shadow)}.search input{border:0;outline:0;background:transparent;color:var(--text);font-size:17px;width:100%}
.quick{background:var(--card);border-radius:16px;padding:12px;margin-bottom:18px;box-shadow:var(--shadow);display:flex;gap:10px}.quick input{flex:1;border:0;outline:0;background:transparent;color:var(--text);font-size:16px}.add{border:0;border-radius:12px;background:var(--blue);color:#fff;width:40px;height:40px;font-size:26px;line-height:1}
.section{margin:18px 0}.section-title{font-size:13px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin:0 6px 8px}.card{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;gap:12px;padding:14px 14px;border-bottom:1px solid var(--line);align-items:flex-start}.row:last-child{border-bottom:0}.circle{margin-top:2px;width:23px;height:23px;border:2px solid var(--muted);border-radius:50%;flex:0 0 auto;background:transparent}.circle.done{border-color:var(--blue);background:var(--blue);color:#fff;text-align:center;font-size:15px;line-height:19px}.main{min-width:0;flex:1}.title{font-size:17px;line-height:1.25}.doneText{text-decoration:line-through;color:var(--muted)}.meta{font-size:13px;color:var(--muted);margin-top:4px}.priority{color:var(--red);font-weight:650}.actions{display:flex;gap:5px}.iconbtn{border:0;background:transparent;color:var(--muted);font-size:18px;padding:2px 4px}.empty{text-align:center;color:var(--muted);padding:30px}
.bottom{position:fixed;z-index:5;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:#ffffffdc;backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;justify-content:center}
@media(prefers-color-scheme:dark){.bottom{background:#1c1c1edc}}.newbtn{background:var(--blue);color:white;border:0;border-radius:22px;padding:11px 18px;font-size:16px;font-weight:650}
dialog{border:0;border-radius:22px;background:var(--card);color:var(--text);width:min(92vw,520px);padding:0;box-shadow:0 24px 80px #0006}dialog::backdrop{background:#0006}.modal{padding:20px}.modal h2{margin:0 0 14px}.field{margin:10px 0}.field label{display:block;color:var(--muted);font-size:12px;margin:0 0 5px}.field input,.field textarea,.field select{width:100%;padding:11px;border:1px solid var(--line);border-radius:11px;background:var(--bg);color:var(--text);font-size:16px}.field textarea{min-height:70px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.modal-actions button{border:0;border-radius:12px;padding:10px 15px;font-size:15px}.cancel{background:var(--bg);color:var(--text)}.save{background:var(--blue);color:#fff}.hint{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.35}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 14px;border-radius:14px;opacity:0;pointer-events:none;transition:.2s;z-index:20;font-size:14px}.toast.show{opacity:1}
</style>
</head>
<body>
<div class="app">
<header><div><h1>Reminders</h1></div><div class="count" id="count"></div></header>
<div class="search">⌕ <input id="search" placeholder="Search"></div>
<div class="quick"><input id="quick" placeholder="Try “dentist tomorrow at 9am”"><button class="add" id="quickAdd">+</button></div>
<div id="list"></div>
</div>
<div class="bottom"><button class="newbtn" id="newBtn">＋ New Reminder</button></div>
<dialog id="dlg"><form method="dialog" class="modal" id="form">
<h2 id="dlgTitle">New Reminder</h2>
<div class="field"><label>Title</label><input id="title" required placeholder="What do you need to remember?"></div>
<div class="field"><label>Notes</label><textarea id="notes" placeholder="Optional notes"></textarea></div>
<div class="grid">
<div class="field"><label>Date</label><input id="date" type="date"></div>
<div class="field"><label>Time</label><input id="time" type="time"></div>
</div>
<div class="grid">
<div class="field"><label>Priority</label><select id="priority"><option value="none">None</option><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option></select></div>
<div class="field"><label>Repeat</label><select id="repeat"><option value="none">Never</option><option value="daily">Daily</option><option value="weekdays">Weekdays</option><option value="weekly">Weekly</option><option value="monthly">Monthly</option><option value="yearly">Yearly</option></select></div>
</div>
<div class="hint">Natural language works in the quick box: “in 45 minutes”, “tomorrow 8pm”, “next Monday at 9”, “every weekday at 8am”, “Oct 12 at 7pm”.</div>
<div class="modal-actions"><button type="button" class="cancel" id="cancel">Cancel</button><button class="save">Save</button></div>
</form></dialog>
<div class="toast" id="toast"></div>
<script>
const KEY="reminders-pwa-pro-v1"; let items=JSON.parse(localStorage.getItem(KEY)||"[]"); let editing=null;
const $=id=>document.getElementById(id), pad=n=>String(n).padStart(2,"0");
function save(){localStorage.setItem(KEY,JSON.stringify(items)); render(); scheduleChecks()}
function fmt(d){return new Intl.DateTimeFormat(undefined,{weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}).format(d)}
function isoDate(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function parseTime(s){let m=s.match(/(?:at|around|by)?\\s*(\\d{1,2})(?::(\\d{2}))?\\s*(am|pm)?/i);if(!m)return null;let h=+m[1],min=+(m[2]||0),ap=(m[3]||"").toLowerCase();if(ap==="pm"&&h<12)h+=12;if(ap==="am"&&h===12)h=0;if(h>23||min>59)return null;return [h,min]}
function nextWeekday(name,base=new Date()){let names=["sunday","monday","tuesday","wednesday","thursday","friday","saturday"],i=names.indexOf(name.toLowerCase());if(i<0)return null;let d=new Date(base);let delta=(i-d.getDay()+7)%7;if(delta===0)delta=7;d.setDate(d.getDate()+delta);return d}
function parseNL(raw){let s=raw.trim(), lower=s.toLowerCase(), now=new Date(), d=new Date(now);let repeat="none";
if(/\\bevery\\s+weekday/.test(lower)){repeat="weekdays";s=s.replace(/\\bevery\\s+weekday(?:s)?/ig,"");}
else if(/\\bevery\\s+day/.test(lower)){repeat="daily";s=s.replace(/\\bevery\\s+days?/ig,"");}
else if(/\\bevery\\s+(monday|tuesday|wednesday|thursday|friday|saturday|sunday)/.test(lower)){repeat="weekly";s=s.replace(/\\bevery\\s+(monday|tuesday|wednesday|thursday|friday|saturday|sunday)/ig,"");}
let m=lower.match(/\\b(?:in|after)\\s+(\\d+)\\s*(minute|minutes|min|hour|hours|hr|hrs|day|days|week|weeks)\\b/);
if(m){let n=+m[1],u=m[2];let ms=/min/.test(u)?6e4:/hour|hr/.test(u)?36e5:/day/.test(u)?864e5:6048e5;d=new Date(now.getTime()+n*ms);s=s.replace(m[0],"");}
else if(/\\bday after tomorrow\\b/.test(lower)){d.setDate(d.getDate()+2);s=s.replace(/\\bday after tomorrow\\b/i,"");}
else if(/\\btomorrow\\b/.test(lower)){d.setDate(d.getDate()+1);s=s.replace(/\\btomorrow\\b/i,"");}
else if(/\\btoday\\b/.test(lower)){s=s.replace(/\\btoday\\b/i,"");}
else {let wd=lower.match(/\\b(?:next|this|coming)?\\s*(monday|tuesday|wednesday|thursday|friday|saturday|sunday)\\b/);if(wd){d=nextWeekday(wd[1],now);s=s.replace(wd[0],"");}
else {let md=lower.match(/\\b(january|february|march|april|may|june|july|august|september|october|november|december|jan|feb|mar|apr|jun|jul|aug|sep|sept|oct|nov|dec)\\s+(\\d{1,2})(?:\\s+(\\d{4}))?\\b/i);if(md){let months=["january","february","march","april","may","june","july","august","september","october","november","december"],mon=months.findIndex(x=>x.startsWith(md[1].toLowerCase().slice(0,3)));let y=md[3]?+md[3]:now.getFullYear();d=new Date(y,mon,+md[2],now.getHours(),now.getMinutes());if(!md[3]&&d<now)d.setFullYear(y+1);s=s.replace(md[0],"");}}}
let tm=lower.match(/\\b(?:at|around|by)\\s+(.+?)(?=$|\\s+(?:for|because|with|and)\\b)/);if(!tm)tm=lower.match(/\\b(\\d{1,2}(?::\\d{2})?\\s*(?:am|pm))\\b/);let t=parseTime(tm?tm[1]:"");if(!t&&/\\bnoon\\b/.test(lower))t=[12,0];if(!t&&/\\bmidnight\\b/.test(lower))t=[0,0];if(!t)t=[9,0];d.setHours(t[0],t[1],0,0);if(d<=now && !/\\b(today|tomorrow|in|after)\\b/.test(lower) && !repeat)d.setDate(d.getDate()+1);
s=s.replace(/\\b(?:at|around|by)\\s+(.+?)(?=$|\\s+(?:for|because|with|and)\\b)/ig,"").replace(/\\b(\\d{1,2}(?::\\d{2})?\\s*(?:am|pm))\\b/ig,"").replace(/\\s+/g," ").trim();
return {title:s||raw,due:d,repeat}}
function addFromQuick(){let raw=$("quick").value.trim();if(!raw)return;let p=parseNL(raw);items.push({id:crypto.randomUUID(),title:p.title,due:p.due.toISOString(),notes:"",priority:"none",repeat:p.repeat,done:false});$("quick").value="";save();notify("Reminder added")}
function openNew(){editing=null;$("dlgTitle").textContent="New Reminder";$("form").reset();let d=new Date(Date.now()+3600000);$("date").value=isoDate(d);$("time").value=pad(d.getHours())+":"+pad(d.getMinutes());$("dlg").showModal()}
function openEdit(id){let x=items.find(i=>i.id===id);if(!x)return;editing=id;$("dlgTitle").textContent="Edit Reminder";$("title").value=x.title;$("notes").value=x.notes||"";let d=new Date(x.due);$("date").value=isoDate(d);$("time").value=pad(d.getHours())+":"+pad(d.getMinutes());$("priority").value=x.priority||"none";$("repeat").value=x.repeat||"none";$("dlg").showModal()}
$("form").addEventListener("submit",e=>{e.preventDefault();let d=new Date($("date").value+"T"+$("time").value);let obj={id:editing||crypto.randomUUID(),title:$("title").value.trim(),notes:$("notes").value.trim(),due:d.toISOString(),priority:$("priority").value,repeat:$("repeat").value,done:false};if(editing){let old=items.find(x=>x.id===editing);obj.done=old.done;items=items.map(x=>x.id===editing?obj:x)}else items.push(obj);$("dlg").close();save()});
$("cancel").onclick=()=>$("dlg").close();$("newBtn").onclick=openNew;$("quickAdd").onclick=addFromQuick;$("quick").addEventListener("keydown",e=>{if(e.key==="Enter")addFromQuick()});$("search").oninput=render;
function toggle(id){let x=items.find(i=>i.id===id);x.done=!x.done;save()}
function del(id){items=items.filter(i=>i.id!==id);save()}
function section(title,arr){if(!arr.length)return "";return `<div class="section"><div class="section-title">${title}</div><div class="card">${arr.map(x=>row(x)).join("")}</div></div>`}
function row(x){let d=new Date(x.due), overdue=!x.done&&d<new Date(), pr=x.priority!=="none"?`<span class="priority"> · ${x.priority}</span>`:"";let repeat=x.repeat!=="none"?` · ↻ ${x.repeat}`:"";return `<div class="row"><button class="circle ${x.done?"done":""}" onclick="toggle('${x.id}')">${x.done?"✓":""}</button><div class="main"><div class="title ${x.done?"doneText":""}">${esc(x.title)}</div><div class="meta">${overdue?"Overdue · ":""}${fmt(d)}${pr}${repeat}</div>${x.notes?`<div class="meta">${esc(x.notes)}</div>`:""}</div><div class="actions"><button class="iconbtn" onclick="openEdit('${x.id}')">⋯</button><button class="iconbtn" onclick="del('${x.id}')">×</button></div></div>`}
function render(){let q=$("search").value.toLowerCase();let active=items.filter(x=>!x.done&&(x.title+" "+(x.notes||"")).toLowerCase().includes(q)).sort((a,b)=>new Date(a.due)-new Date(b.due));let done=items.filter(x=>x.done&&(x.title+" "+(x.notes||"")).toLowerCase().includes(q)).sort((a,b)=>new Date(b.due)-new Date(a.due));let now=new Date(),today=isoDate(now),tom=new Date(now);tom.setDate(tom.getDate()+1);let tod=active.filter(x=>isoDate(new Date(x.due))===today), tomorrow=active.filter(x=>isoDate(new Date(x.due))===isoDate(tom)), upcoming=active.filter(x=>!tod.includes(x)&&!tomorrow.includes(x));$("list").innerHTML=section("Today",tod)+section("Tomorrow",tomorrow)+section("Upcoming",upcoming)+section("Completed",done)||`<div class="empty">No reminders yet</div>`;$("count").textContent=active.length+" remaining"}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
let timer;function notify(msg){$("toast").textContent=msg;$("toast").classList.add("show");clearTimeout(timer);timer=setTimeout(()=>$("toast").classList.remove("show"),1800)}
let last={};async function requestNotifications(){if("Notification"in window&&Notification.permission==="default")await Notification.requestPermission()}
function scheduleChecks(){clearTimeout(window._check);window._check=setTimeout(checkDue,1000)}
async function checkDue(){let now=Date.now();for(let x of items){if(x.done)continue;let t=new Date(x.due).getTime();if(t<=now&&t>now-70000&&!last[x.id]){last[x.id]=1;if("Notification"in window&&Notification.permission==="granted")new Notification(x.title,{body:"Your reminder is due.",tag:x.id});else notify("⏰ "+x.title)}}window._check=setTimeout(checkDue,15000)}
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
requestNotifications();render();scheduleChecks();
</script>
</body></html>
